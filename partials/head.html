<script>
/* Hides the page until js/i18n.js has translated it, when the language isn't
   the markup's (Spanish). Mirrors detect() in js/i18n.js; the timeout keeps
   the page from staying hidden if scripts fail. */
(function(){try{var l=localStorage.getItem('pk-lang');if(l!=='es'&&l!=='en'){l='en';var ls=navigator.languages||[navigator.language];for(var i=0;i<ls.length;i++){var c=(ls[i]||'').slice(0,2).toLowerCase();if(c==='es'||c==='en'){l=c;break}}}if(l!=='es'){var d=document.documentElement;d.classList.add('i18n-loading');setTimeout(function(){d.classList.remove('i18n-loading')},2500)}}catch(e){}})();
</script>
