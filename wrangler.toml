# The Worker keeps its original name: renaming it would create a second Worker
# and clash with the custom domains already attached to this one.
name = "escala-de-values"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first so it can redirect the old subdomain before assets are served.
run_worker_first = true

[[routes]]
pattern = "palettekit.fardus.dev"
custom_domain = true

# Old subdomain, redirected to palettekit.fardus.dev by src/worker.js.
[[routes]]
pattern = "values.fardus.dev"
custom_domain = true
